<!DOCTYPE html>
<html>
  <body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif;">
    
    <table width="100%" cellpadding="0" cellspacing="0" style="padding: 20px;">
      <tr>
        <td align="center">

          <table width="500" cellpadding="0" cellspacing="0" style="background: #ffffff; border-radius: 10px; overflow: hidden;">

            <tr>
              <td style="background-color: #038FA7; padding: 20px; text-align: center; color: white;">
                <h2 style="margin: 0;">MentisTech</h2>
                <p style="margin: 5px 0 0;">Solicitação de Apoio</p>
              </td>
            </tr>

            <tr>
              <td style="padding: 20px; color: #333;">

                  <p><strong>Nome:</strong> {{ user_name }}</p>
                  <p><strong>Email:</strong> {{ user_email }}</p>
                  <p><strong>ID:</strong> {{ user_id }}</p>

                <hr style="border: none; border-top: 1px solid #eee; margin: 20px 0;">

                <p style="margin-bottom: 10px;"><strong>Mensagem:</strong></p>

                <hr style="border: none; border-top: 1px solid #eee; margin: 20px 0;">

                <p style="margin-bottom: 10px;"><strong>Mensagem: </strong></p>

                <p style="
                    background: #f9f9f9;
                    padding: 15px;
                    border-radius: 6px;
                    border-left: 4px solid #FD6C01;
                    white-space: pre-line;
                    line-height: 1.6;
                    text-align: justify;
                    margin: 0;
                    ">
                    {{ message }}
                </p>
                <p style="margin: 0 0 10px; color: #66625c;"><strong>Mensagem:</strong></p>

              </td>
            </tr>

            <tr>
              <td style="background: #f4f4f4; padding: 15px; text-align: center; font-size: 12px; color: #777;">
                <p style="margin: 0;">
                    Este e-mail foi gerado automaticamente pelo sistema MentisTech.<br>
                    Caso deseje entrar em contato com o solicitante, responda diretamente a este e-mail.
                </p>
              </td>
            </tr>

          </table>

        </td>
      </tr>
    </table>

  </body>
</html>
